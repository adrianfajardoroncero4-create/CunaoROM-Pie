name: Build CunaoROM Pie
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev openjdk-8-jdk python2
      - name: Init repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          mkdir -p lineage
          cd lineage
          ~/bin/repo init -u https://github.com/LineageOS/android.git -b lineage-16.0 --depth=1
          ~/bin/repo sync -c -j4 --force-sync --no-clone-bundle --no-tags
      - name: Clone device trees j4primelte
        run: |
          cd lineage
          git clone https://github.com/Galaxy-J4-Plus/android_device_samsung_j4primelte.git -b lineage-16.0 device/samsung/j4primelte
          git clone https://github.com/Galaxy-J4-Plus/android_device_samsung_msm8917-common.git -b lineage-16.0 device/samsung/msm8917-common
          git clone https://github.com/Galaxy-J4-Plus/android_kernel_samsung_msm8917.git -b lineage-16.0 kernel/samsung/msm8917
          git clone https://github.com/Galaxy-J4-Plus/proprietary_vendor_samsung.git -b lineage-16.0 vendor/samsung
      - name: Build
        run: |
          cd lineage
          source build/envsetup.sh
          breakfast j4primelte
          croot
          brunch j4primelte
      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: CunaoROM-j4primelte
          path: lineage/out/target/product/j4primelte/*.zip
